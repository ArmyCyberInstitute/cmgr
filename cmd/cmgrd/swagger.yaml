swagger: "2.0"
info:
  description: "This is a minimal REST API for `cmgr` that allows front-ends for a CTF to remotely manage challenges and their templating for events.  It is not intended to replace `cmgr` entirely as it does not currently expose the challenge update process."
  version: "0.3.0"
  title: "cmgrd"
  contact:
    email: "code@acictf.com"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
tags:
- name: "challenges"
  description: "Management of templatable challenges as well as accessing their metadata."
- name: "builds"
  description: "Management of challenges that have been templated with a concrete flag and associated artifacts."
- name: "instances"
  description: "Management of challenge instances with which competitors can interact."
- name: "schemas"
  description: "Management of schemas which group build and instance resources into a single declarative unit."
schemes:
- "http"
paths:
  /challenges:
    get:
      parameters:
        - name: "tags"
          in: "query"
          description: "Seach for available challenges limiting to given tags"
          required: false
          type: array
          items:
            type: string
      tags: [challenges]
      produces: ["application/json"]
      summary: "Lists all available challenges"
      responses:
        "500":
          description: "A database error occurred in `cmgr`"
        "200":
          description: "A list of all valid challenge identifiers"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/ChallengeListElement"
  /challenges/{challenge_id}:
    parameters:
      - name: "challenge_id"
        in: "path"
        description: "The identifier for the challenge"
        required: true
        type: "string"
    get:
      tags: [challenges]
      produces: ["application/json"]
      summary: "Gets the metadata for the challenge"
      responses:
        "404":
          description: "Invalid path string to include invalid challenge identifier"
        "500":
          description: "A database error occurred in `cmgr`"
        "200":
          description: "The metadata for the challenge"
          schema:
            $ref: "#/definitions/ChallengeMetadata"
    post:
      tags: [challenges]
      produces: ["application/json"]
      summary: "Builds templated versions of the challenge"
      description: "Uses the flag format and seed to template out a new version of the challenge.  This may take a signficant amount of time."
      parameters:
        - in: "body"
          name: "body"
          description: "templating information for `cmgr`"
          required: true
          schema:
            $ref: "#/definitions/BuildChallengeRequest"
      responses:
        "400":
          description: "The request body, flag format, or seeds are invalid"
        "404":
          description: "Invalid path string to include invalid challenge identifier"
        "409":
          description: "The request conflicts with existing state"
        "500":
          description: "A database error occurred in `cmgr`"
        "200":
          description: "The builds in the same order as the supplied seeds"
          schema:
            type: array
            items:
              $ref: "#/definitions/BuildMetadata"
  /builds/{build_id}:
    parameters:
      - name: "build_id"
        in: "path"
        description: "The identifier for the build"
        required: true
        type: "string"
    get:
      tags: [builds]
      produces: ["application/json"]
      summary: "Gets the metadata for the build"
      responses:
        "404":
          description: "Invalid path string to include invalid build identifier"
        "500":
          description: "A database error occurred in `cmgr`"
        "200":
          description: "The metadata for the build"
          schema:
            $ref: "#/definitions/BuildMetadata"
    post:
      tags: [builds]
      produces: ["application/json"]
      summary: "Starts an instance of the build"
      responses:
        "404":
          description: "Invalid path string to include invalid build identifier"
        "409":
          description: "The build is controlled by a schema and cannot be started directly"
        "500":
          description: "A database error occurred in `cmgr`"
        "201":
          description: "The metadata for the new instance"
          schema:
            $ref: "#/definitions/InstanceMetadata"
    delete:
      tags: [builds]
      produces: ["application/json"]
      summary: "Destroys the build (releases resources)"
      responses:
        "404":
          description: "Invalid path string to include invalid build identifier"
        "409":
          description: "The build is controlled by a schema or still has live instances"
        "500":
          description: "A database error occurred in `cmgr`"
        "204":
          description: "Indicates successfully deleted"
  /builds/{build_id}/{artifact}:
    parameters:
      - name: "build_id"
        in: "path"
        description: "The identifier for the build"
        required: true
        type: "string"
      - name: "artifact"
        in: "path"
        description: "The name of the artifact to download ('artifacts.tar.gz' to download all of them in a bundle)"
        required: true
        type: "string"
    get:
      tags: [builds]
      summary: "The requested artifact"
      responses:
        "404":
          description: "The requested artifact does not exist"
        "500":
          description: "An error occurred while reading the artifact from disk"
        "200":
          description: "The artifact"
  /instances/{instance_id}:
    parameters:
      - name: "instance_id"
        in: "path"
        description: "The identifier for the instance"
        required: true
        type: "string"
    get:
      tags: [instances]
      produces: ["application/json"]
      summary: "Gets the metadata for the instance"
      responses:
        "404":
          description: "Invalid path string to include invalid instance identifier"
        "500":
          description: "A database error occurred in `cmgr`"
        "200":
          description: "The metadata for the instance"
          schema:
            $ref: "#/definitions/InstanceMetadata"
    post:
      tags: [instances]
      produces: ["application/json"]
      summary: "Runs the automated solver against the instance"
      responses:
        "404":
          description: "Invalid path string to include invalid instance identifier"
        "500":
          description: "A database error occurred in `cmgr`.  Could also indicate that the solve failed or does not exist."
        "204":
          description: "Indicates solve ran correctly"
    delete:
      tags: [instances]
      produces: ["application/json"]
      summary: "Stops an instance"
      responses:
        "404":
          description: "Invalid path string to include invalid instance identifier"
        "409":
          description: "The instance is controlled by a schema and cannot be stopped directly"
        "500":
          description: "A database error occurred in `cmgr`"
        "204":
          description: "Indicates successfully stopped"
  /schemas:
    get:
      tags: [schemas]
      produces: ["application/json"]
      summary: "Gets the list of all current schemas"
      responses:
        "404":
          description: "Invalid path string"
        "500":
          description: "A database error occurred in `cmgr` (currently includes bad build identifiers)"
        "200":
          description: "The list of schemas"
          schema:
            type: array
            items:
              type: string
    post:
      tags: [schemas]
      produces: ["application/json"]
      summary: "Creates a schema with the given definition"
      parameters:
        - in: "body"
          name: "body"
          description: "templating information for `cmgr`"
          required: true
          schema:
            $ref: "#/definitions/SchemaDefinition"
      responses:
        "400":
          description: "The schema definition is invalid"
        "409":
          description: "A schema with this name already exists"
        "404":
          description: "Invalid path string"
        "500":
          description: "A database error occurred in `cmgr` (currently includes bad build identifiers)."
        "201":
          description: "Indicates schema created successfully"
  /schemas/{schema_name}:
    parameters:
      - name: "schema_name"
        in: "path"
        description: "The identifier for the schema"
        required: true
        type: "string"
    get:
      tags: [schemas]
      produces: ["application/json"]
      summary: "Gets the current deployed state of the schema"
      responses:
        "404":
          description: "Invalid path string"
        "500":
          description: "A database error occurred in `cmgr` (currently includes bad build identifiers)"
        "200":
          description: "The metadata for all challenges, builds, and instances controlled or referenced by this schema"
          schema:
            type: array
            items:
              $ref: "#/definitions/ChallengeMetadata"
    post:
      tags: [schemas]
      produces: ["application/json"]
      summary: "Updates the schema to match the given definition"
      parameters:
        - in: "body"
          name: "body"
          description: "templating information for `cmgr`"
          required: true
          schema:
            $ref: "#/definitions/SchemaDefinition"
      responses:
        "400":
          description: "Value for 'schema_name' did not match the name in the schema definition"
        "404":
          description: "Invalid path string"
        "500":
          description: "A database error occurred in `cmgr` (currently includes bad build identifiers)."
        "204":
          description: "Indicates schema updated successfully"
    delete:
      tags: [schemas]
      produces: ["application/json"]
      summary: "Deletes a schema and all of its associated builds and instances"
      responses:
        "404":
          description: "Invalid path string"
        "409":
          description: "The schema belongs to manual builds and cannot be deleted through this endpoint"
        "500":
          description: "A database error occurred in `cmgr`"
        "204":
          description: "Indicates successfully removed"
definitions:
  ChallengeListElement:
    type: "object"
    properties:
      id:
        type: string
      source_checksum:
        type: integer
        format: int64
      metadata_checksum:
        type: integer
        format: int64
      source_digest:
        type: string
      metadata_digest:
        type: string
      solve_script:
        type: boolean
  ChallengeMetadata:
    type: "object"
    properties:
      id:
        type: string
      name:
        type: string
      namespace:
        type: string
      challenge_type:
        type: string
      description:
        type: string
      details:
        type: string
      hints:
        type: array
        items:
          type: string
      source_checksum:
        type: integer
        format: int64
      metadata_checksum:
        type: integer
        format: int64
      source_digest:
        type: string
      metadata_digest:
        type: string
      path:
        type: string
      templatable:
        type: boolean
      port_map:
        type: object
        additionalProperties:
          $ref: "#/definitions/PortInfo"
      max_users:
        type: integer
        format: int32
      category:
        type: string
      points:
        type: integer
        format: int32
      tags:
        type: array
        items:
          type: string
      attributes:
        type: object
        additionalProperties:
          type: string
      challenge_options:
        $ref: "#/definitions/ChallengeOptions"
      solve_script:
        type: boolean
      builds:
        type: array
        items:
          $ref: "#/definitions/BuildMetadata"
  BuildMetadata:
    type: object
    properties:
      id:
        type: integer
        format: int64
      flag:
        type: string
      lookup_data:
        type: object
        additionalProperties:
          type: string
      required_seccomp_tweaks:
        type: array
        items:
          type: string
      seed:
        type: integer
        format: int32
      format:
        type: string
      images:
        type: array
        items:
          $ref: "#/definitions/Image"
      has_artifacts:
        type: boolean
      last_solved:
        type: integer
        format: int64
      challenge_id:
        type: string
      schema:
        type: string
      instance_count:
        type: integer
        format: int32
      instances:
        type: array
        items:
          $ref: "#/definitions/InstanceMetadata"
  Image:
    type: object
    properties:
      id:
        type: integer
        format: int64
      host:
        type: string
      exposed_ports:
        type: array
        items:
          type: string
      build:
        type: integer
        format: int64
  InstanceMetadata:
    type: object
    properties:
      id:
        type: integer
        format: int64
      ports:
        type: object
        additionalProperties:
          type: integer
          format: int32
      containers:
        type: array
        items:
          type: string
      last_solved:
        type: integer
        format: int64
      build_id:
        type: integer
        format: int64
  PortInfo:
    type: object
    required: [host, port]
    properties:
      host:
        type: string
      port:
        type: integer
        format: int32
        minimum: 1
        maximum: 65535
  SeccompOptions:
    type: object
    properties:
      legacy:
        type: boolean
      tweaks:
        type: array
        items:
          type: string
      profile:
        type: string
  ContainerOptions:
    type: object
    properties:
      init:
        type: boolean
      cpus:
        type: string
      memory:
        type: string
      ulimits:
        type: array
        items:
          type: string
      pidslimit:
        type: integer
        format: int64
        minimum: -1
      readonlyrootfs:
        type: boolean
      droppedcaps:
        type: array
        items:
          type: string
      nonewprivileges:
        type: boolean
      diskquota:
        type: string
      cgroupparent:
        type: string
      seccomp:
        $ref: "#/definitions/SeccompOptions"
  ChallengeOptions:
    allOf:
      - $ref: "#/definitions/ContainerOptions"
      - type: object
        properties:
          allow_egress:
            type: boolean
            default: false
          overrides:
            type: object
            additionalProperties:
              $ref: "#/definitions/ContainerOptions"
  BuildChallengeRequest:
    type: object
    required: [seeds]
    properties:
      flag_format:
        type: string
        maxLength: 128
        description: "Contains exactly one literal %s placeholder"
      seeds:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: integer
          format: int32
  SchemaDefinition:
    type: object
    required: [name, flag_format, challenges]
    properties:
      name:
        type: string
      flag_format:
        type: string
        maxLength: 128
        description: "Contains exactly one literal %s placeholder"
      challenges:
        type: object
        additionalProperties:
          $ref: "#/definitions/SchemaElement"
  SchemaElement:
    type: object
    properties:
      seeds:
        type: array
        uniqueItems: true
        items:
          type: integer
          format: int32
      instance_count:
        type: integer
        format: int32
        minimum: -1
