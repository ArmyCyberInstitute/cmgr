name: Go

on:
  push:
  pull_request:
    branches:
      - master
      - dev
      - 2026-refactor

permissions:
  contents: read

env:
  CMGR_LOGGING: debug
  GOFLAGS: -mod=readonly

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go:
          - 1.25.12
          - 1.26.5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify dependencies
        run: bash support/verify_go_modules.sh

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Build
        run: |
          mkdir -p bin
          go build -trimpath \
            -ldflags "-X github.com/ArmyCyberInstitute/cmgr/cmgr.version=$(git describe --tags --always)" \
            -o bin/ ./cmd/...

  python-format:
    name: Python formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Black
        run: |
          python3 -m venv "${RUNNER_TEMP}/black"
          "${RUNNER_TEMP}/black/bin/pip" install --disable-pip-version-check black==26.5.1

      - name: Check formatting
        run: find . -name '*.py' -print0 | xargs -0 "${RUNNER_TEMP}/black/bin/black" --check

  vulnerability-scan:
    name: Reachable Go vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Verify dependencies
        run: bash support/verify_go_modules.sh

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  license-check:
    name: Go dependency licenses
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Verify dependencies
        run: bash support/verify_go_modules.sh

      - name: Check dependency licenses
        run: |
          go run github.com/google/go-licenses/v2@v2.0.1 \
            check ./cmd/... --include_tests

  integration:
    name: Example integration tests (runner Docker)
    runs-on: ubuntu-24.04
    needs:
      - test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Verify dependencies
        run: bash support/verify_go_modules.sh

      - name: Build cmgr
        run: |
          mkdir -p bin artifacts
          go build -trimpath \
            -ldflags "-X github.com/ArmyCyberInstitute/cmgr/cmgr.version=$(git describe --tags --always)" \
            -o bin/ ./cmd/...

      - name: Register seccomp tweak runtime
        run: |
          sudo install -d -o root -g root -m 0755 /usr/lib/cmgr
          sudo install -o root -g root -m 0755 \
            bin/cmgr-oci-interceptor \
            /usr/lib/cmgr/cmgr-oci-interceptor
          sudo /usr/lib/cmgr/cmgr-oci-interceptor register

      - name: Run example solvers
        env:
          CMGR_DIR: examples
          CMGR_ARTIFACT_DIR: artifacts
        run: bin/cmgr test --require-solve examples

  engine-integration:
    name: Example integration tests (Docker ${{ matrix.engine }})
    runs-on: ubuntu-24.04
    needs:
      - test
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: 28.5.2
            image: docker@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
          - engine: 29.6.2
            image: docker@sha256:bfec1f5159c63a81ca6fdedbd81404d2c0e16378ed0feec3bb3fbf3998847659
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Verify dependencies
        run: bash support/verify_go_modules.sh

      - name: Build cmgr
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin artifacts
          go build -trimpath \
            -ldflags "-X github.com/ArmyCyberInstitute/cmgr/cmgr.version=$(git describe --tags --always)" \
            -o bin/ ./cmd/...

      - name: Start Docker Engine ${{ matrix.engine }}
        env:
          ENGINE_IMAGE: ${{ matrix.image }}
          ENGINE_VERSION: ${{ matrix.engine }}
          INNER_DOCKER_HOST: tcp://127.0.0.1:23750
        run: |
          sudo docker run \
            --privileged \
            --detach \
            --name cmgr-ci-engine \
            --restart=no \
            --env DOCKER_TLS_CERTDIR= \
            --publish 127.0.0.1:23750:2375 \
            "${ENGINE_IMAGE}" \
            --host=tcp://0.0.0.0:2375 \
            --host=unix:///var/run/docker.sock \
            --storage-driver=overlay2

          ready=
          for attempt in $(seq 1 60); do
            if docker --host "${INNER_DOCKER_HOST}" info >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "${ready}" = 1

          actual_version="$(
            docker --host "${INNER_DOCKER_HOST}" version \
              --format '{{.Server.Version}}'
          )"
          test "${actual_version}" = "${ENGINE_VERSION}"

      - name: Register seccomp tweak runtime
        env:
          INNER_DOCKER_HOST: tcp://127.0.0.1:23750
        run: |
          sudo docker exec cmgr-ci-engine \
            install -d -o root -g root -m 0755 /usr/lib/cmgr
          sudo docker cp \
            bin/cmgr-oci-interceptor \
            cmgr-ci-engine:/usr/lib/cmgr/cmgr-oci-interceptor
          sudo docker exec cmgr-ci-engine \
            chown root:root /usr/lib/cmgr/cmgr-oci-interceptor
          sudo docker exec cmgr-ci-engine \
            chmod 0755 /usr/lib/cmgr/cmgr-oci-interceptor

          printf '%s\n' \
            '#!/bin/sh' \
            'if [ "${1:-}" != "reload" ] || [ "${2:-}" != "docker" ]; then exit 2; fi' \
            'dockerd_pid="$(pidof dockerd)"' \
            '[ -n "${dockerd_pid}" ] || exit 3' \
            'kill -HUP "${dockerd_pid}"' |
            sudo docker exec -i cmgr-ci-engine sh -c \
              'umask 022; cat > /usr/bin/systemctl; chmod 0755 /usr/bin/systemctl'

          sudo docker exec cmgr-ci-engine \
            /usr/lib/cmgr/cmgr-oci-interceptor register

          ready=
          for attempt in $(seq 1 30); do
            if docker --host "${INNER_DOCKER_HOST}" info \
              --format '{{json .Runtimes}}' |
              grep -Fq '"cmgr-oci-interceptor"'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready}" = 1

      - name: Run example solvers
        env:
          DOCKER_HOST: tcp://127.0.0.1:23750
          CMGR_DIR: examples
          CMGR_ARTIFACT_DIR: artifacts
          CMGR_INTERFACE: 0.0.0.0
          CMGR_PORTS: 24750-25249
        run: bin/cmgr test --require-solve examples

      - name: Build distinct challenges from four cmgr processes
        env:
          DOCKER_HOST: tcp://127.0.0.1:23750
          CMGR_INTERFACE: 0.0.0.0
          CMGR_PORTS: 24750-25249
          CMGR_PARALLEL_TEST_ROOT: ${{ runner.temp }}/cmgr-parallel-builds
        run: |
          mkdir -p "${CMGR_PARALLEL_TEST_ROOT}"
          bash support/test_parallel_process_builds.sh bin/cmgr examples

      - name: Show nested Docker logs
        if: failure()
        run: sudo docker logs cmgr-ci-engine

      - name: Remove nested Docker daemon
        if: always()
        run: sudo docker rm --force cmgr-ci-engine
