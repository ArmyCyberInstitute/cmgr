name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.goos }}/${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            arch: amd64
          - os: ubuntu-24.04
            goos: linux
            arch: arm64
          - os: macos-26
            goos: darwin
            arch: amd64
          - os: macos-26
            goos: darwin
            arch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Verify dependencies
        run: bash support/verify_go_modules.sh

      - name: Build release binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p "dist/cmgr_${GOOS}_${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/ArmyCyberInstitute/cmgr/cmgr.version=${GITHUB_REF_NAME}" \
            -o "dist/cmgr_${GOOS}_${GOARCH}/" ./cmd/...
          cp LICENSE "dist/cmgr_${GOOS}_${GOARCH}/LICENSE"
          {
            cat NOTICE
            cat NOTICE.release
          } > "dist/cmgr_${GOOS}_${GOARCH}/NOTICE"

      - name: Collect dependency licenses
        run: |
          go run github.com/google/go-licenses/v2@v2.0.1 save ./cmd/... \
            --ignore github.com/ArmyCyberInstitute/cmgr \
            --save_path "dist/cmgr_${{ matrix.goos }}_${{ matrix.arch }}/third_party_licenses"

      - name: Create release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          tar -C "dist/cmgr_${GOOS}_${GOARCH}" \
            -czf "cmgr_${GOOS}_${GOARCH}.tar.gz" .

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cmgr_${{ matrix.goos }}_${{ matrix.arch }}
          path: cmgr_${{ matrix.goos }}_${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs:
      - build
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Go module SBOM
        run: |
          bash support/verify_go_modules.sh
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 \
            mod -json -output release-assets/cmgr-go-modules.cdx.json

      - name: Package examples
        run: |
          tar -czf release-assets/examples.tar.gz \
            examples LICENSE NOTICE NOTICE.release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/*.tar.gz \
            release-assets/*.cdx.json \
            --verify-tag \
            --title "Release ${GITHUB_REF_NAME}" \
            --generate-notes
